name: Build Windows x64

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Smoke test CLI
        shell: pwsh
        run: |
          .\build\Release\NamToClo.exe --version
          .\build\Release\NamToClo.exe --help

      - name: Install staging package
        run: cmake --install build --config Release --prefix stage

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path stage\* -DestinationPath dist\NamToCloResearch-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamToCloResearch-windows-x64
          path: dist/NamToCloResearch-windows-x64.zip
          if-no-files-found: error
